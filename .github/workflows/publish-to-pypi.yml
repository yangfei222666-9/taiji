name: publish-to-pypi

on:
  release:
    types: [published]

permissions:
  contents: read
  deployments: read

jobs:
  build:
    name: Build Python distributions
    runs-on: ubuntu-latest
    if: startsWith(github.event.release.tag_name, 'v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Verify publish environment gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts
          gh api "repos/${GITHUB_REPOSITORY}/environments/pypi" > /tmp/pypi-environment.json
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          data = json.loads(Path("/tmp/pypi-environment.json").read_text(encoding="utf-8"))
          rules = data.get("protection_rules") or []
          policy = data.get("deployment_branch_policy") or {}
          has_required_reviewers = any(rule.get("type") == "required_reviewers" for rule in rules)
          has_selected_refs = bool(policy.get("custom_branch_policies"))
          checks = {
              "environment_name_is_pypi": data.get("name") == "pypi",
              "required_reviewers_enabled": has_required_reviewers,
              "selected_refs_enabled": has_selected_refs,
          }
          Path("artifacts/environment-preflight.txt").write_text(
              "\n".join(f"{key}={str(value).lower()}" for key, value in checks.items()) + "\n",
              encoding="utf-8",
          )
          if not all(checks.values()):
              print(json.dumps(checks, indent=2, sort_keys=True), file=sys.stderr)
              raise SystemExit("pypi environment gate is not configured")
          PY

      - name: Build distributions
        run: |
          python -m build

      - name: Verify distributions
        run: |
          test -d dist
          python -m twine check dist/*
          mkdir -p artifacts
          ls -lah dist | tee artifacts/wheel-list.txt
          sha256sum dist/* | tee artifacts/sha256.txt
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          payload = {
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "repository": os.environ["GITHUB_REPOSITORY"],
              "sha": os.environ["GITHUB_SHA"],
              "ref": os.environ["GITHUB_REF"],
              "release_tag": os.environ.get("GITHUB_REF_NAME"),
              "run_id": os.environ["GITHUB_RUN_ID"],
              "generated_at_utc": datetime.now(timezone.utc).isoformat(timespec="seconds"),
              "pypi_publish_executed": False,
              "trusted_publisher_verified_live": False,
          }
          with open("artifacts/build-metadata.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, indent=2, sort_keys=True)
              f.write("\n")
          PY

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: pypi-dist-${{ github.sha }}
          path: |
            dist/*
            artifacts/environment-preflight.txt
            artifacts/sha256.txt
            artifacts/wheel-list.txt
            artifacts/build-metadata.json
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: pypi
      url: https://pypi.org/p/taijios
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: pypi-dist-${{ github.sha }}

      - name: Verify downloaded distributions
        run: |
          test -d dist
          test -s artifacts/sha256.txt
          sha256sum -c artifacts/sha256.txt

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          attestations: true
          print-hash: true

      - name: Record publish boundary
        run: |
          mkdir -p artifacts
          cat > artifacts/publish-run.txt <<EOF
          pypi_publish_executed=true
          trusted_publisher_verified_live=requires_pypi_project_settings_review
          environment_approval=recorded_in_github_deployment_history
          attestation_upload=handled_by_pypa_gh_action_pypi_publish
          EOF

      - name: Upload publish evidence
        uses: actions/upload-artifact@v4
        with:
          name: pypi-publish-evidence-${{ github.sha }}
          path: |
            artifacts/sha256.txt
            artifacts/environment-preflight.txt
            artifacts/wheel-list.txt
            artifacts/build-metadata.json
            artifacts/publish-run.txt
          if-no-files-found: error
          retention-days: 90
